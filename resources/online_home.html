<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Online Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #202124;
      color: #9AA0A6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 24px;
      user-select: none;
    }
    .container { max-width: 580px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; }
    .icon-container { width: 56px; height: 56px; border-radius: 50%; background-color: #3C4043; display: flex; align-items: center; justify-content: center; margin-bottom: 24px; }
    .icon-container svg { width: 32px; height: 32px; fill: #E8EAED; }
    h1 { color: #E8EAED; font-size: 24px; font-weight: 500; margin-bottom: 12px; letter-spacing: 0.2px; }
    .subtitle { color: #9AA0A6; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
      </svg>
    </div>
    <h1>Online Browser</h1>
    <p class="subtitle">Search with Google or enter web address on search bar</p>
  </div>
</body>
</html>
